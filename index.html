<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Euronia</title>
<meta name="description" content="A theoretical research lab for mathematics and NeuroAI.">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to the content</a>

<main id="main" class="wrap">

  <!-- No hero, no banner, no tagline bar. The name, a photograph, who you are in your own
       words, and a line of links. That is how every site in the reference set opens. -->
  <header class="head">
    <div class="head-text">
      <h1 data-person-name>Euronia</h1>
      <p class="role" data-person-role hidden></p>
      <div class="bio" data-bio></div>
      <p class="links" data-links hidden></p>
    </div>
    <img class="photo" data-photo alt="" hidden>
  </header>

  <section data-section="research" hidden>
    <h2>Research</h2>
    <div class="lines" data-research></div>
  </section>

  <section data-section="publications" hidden>
    <h2>Publications</h2>
    <div class="pubs" data-publications></div>
  </section>

  <section data-section="talks" hidden>
    <h2>Talks</h2>
    <ul class="plain" data-talks></ul>
  </section>

  <section data-section="software" hidden>
    <h2>Software</h2>
    <ul class="plain" data-software></ul>
  </section>

  <section data-section="news" hidden>
    <h2>News</h2>
    <ul class="plain" data-news></ul>
  </section>

  <section data-section="contact" hidden>
    <h2>Contact</h2>
    <p class="contact" data-contact></p>
  </section>

  <p class="empty" data-empty hidden>
    This site has not been published to yet.
  </p>

  <footer class="foot">
    <p class="caption" data-generated></p>
  </footer>
</main>

<script src="lab.js"></script>
</body>
</html>
